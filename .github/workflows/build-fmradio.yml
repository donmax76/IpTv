name: Build FM Radio

on:
  push:
    branches: [ 'claude/fm-radio-app-*', 'claude/rebuild-apk-sync-audio-*', 'main', 'master' ]
  workflow_dispatch:

# Only the newest commit on a branch may publish.
#
# Each run rewrites the same release and pushes its own version.json, so two
# runs overlapping means the release comes from one commit and the version file
# from another. Cancelling superseded runs keeps the published APK and the
# version that advertises it describing the same build.
concurrency:
  group: build-fmradio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # so a failure can publish its own log — see below
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for git rev-list --count (version number)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          set -o pipefail
          sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" 2>&1 | tee /tmp/sdk.log

      - name: Build FM Radio APK (debug + release)
        env:
          IPTV_ISSUE_TOKEN: ${{ secrets.IPTV_ISSUE_TOKEN }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :fmradio:assembleDebug :fmradio:assembleRelease :app:assembleDebug 2>&1 | tee /tmp/build.log

      - name: Upload FM Radio Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FmRadio-debug.apk
          path: fmradio/build/outputs/apk/debug/fmradio-debug.apk

      - name: Upload FM Radio Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FmRadio-release.apk
          path: fmradio/build/outputs/apk/release/fmradio-release.apk
          if-no-files-found: ignore

      - name: Upload TVViewer Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TVViewer-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Publish from THIS job, which has already been given a runner.
      #
      # Releasing used to happen only in create-release, a separate job needing
      # a runner of its own. GitHub failed to give it one — "the job was not
      # acquired by Runner of type hosted even after multiple attempts" — while
      # both build jobs went green. So the APK built perfectly and was never
      # published, four times running, and the phone kept being told 3.0.488 was
      # the newest version there was.
      #
      # The APK is what someone waiting for an update needs, and it exists right
      # here. It goes out now, from the runner that built it, so a second runner
      # never being granted can no longer stand between a working build and the
      # car. create-release still runs when it can and rebuilds the whole
      # release including the desktop pieces; this only guarantees the floor.
      - name: Publish APK and version.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          exec > >(tee /tmp/publish.log) 2>&1
          APK=fmradio/build/outputs/apk/release/fmradio-release.apk
          if [ ! -f "$APK" ]; then
            APK=fmradio/build/outputs/apk/debug/fmradio-debug.apk
          fi
          if [ ! -f "$APK" ]; then
            echo "::error::no APK to publish"; exit 1
          fi
          gh release view fmradio-latest >/dev/null 2>&1 ||             gh release create fmradio-latest --title "FM Radio (latest)"               --notes "Automatic build from ${{ github.sha }}"
          # --clobber replaces just this asset, leaving anything else attached.
          gh release upload fmradio-latest "$APK#FmRadio-release.apk" --clobber

          # Only now advertise it. The version file must never name a build that
          # is not downloadable yet, or the app offers an update it cannot get.
          COMMIT_COUNT=$(git rev-list --count HEAD)
          cat > fmradio/version.json << EOF
          {
            "versionCode": $COMMIT_COUNT,
            "versionName": "3.0.$COMMIT_COUNT",
            "downloadUrl": "https://github.com/donmax76/IpTv/releases/download/fmradio-latest/FmRadio-release.apk"
          }
          EOF
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add fmradio/version.json
          if git diff --cached --quiet; then
            echo "version.json already current"; exit 0
          fi
          git commit -m "Auto-update version.json to 3.0.$COMMIT_COUNT"
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            git fetch origin "${{ github.ref_name }}" || true
            git rebase "origin/${{ github.ref_name }}" || { git rebase --abort || true; }
            sleep $((attempt * 3))
          done
          echo "::error::could not publish version.json"
          exit 1
      # LAST in the job on purpose. A failure() step only runs when the step
      # that failed comes BEFORE it, so sitting in the middle it could report a
      # compile error and nothing else — the artifact uploads and the publish
      # step below it were invisible. A red build with no log at all is exactly
      # what that looks like, and that is what happened.
      #
      # Nothing that develops this project can read the Actions logs — GitHub is
      # not reachable from that environment, API or web. So a failure here is
      # completely invisible: builds stopped publishing after 3.0.488 and the
      # only way to tell was that the release APK never changed. Whatever broke
      # gets written back into the repository, where it can be fetched with git
      # like anything else. Pushes made with GITHUB_TOKEN do not start new
      # workflow runs, so this cannot loop.
      - name: Publish the failure log
        if: failure()
        run: |
          mkdir -p ci-logs
          {
            echo "=== failed run: ${{ github.run_id }} attempt ${{ github.run_attempt }}"
            echo "=== commit: ${{ github.sha }}"
            echo
            echo "=== sdkmanager (tail) ==="
            tail -c 20000 /tmp/sdk.log 2>/dev/null || echo "(no sdk log — step never ran)"
            echo
            echo "=== gradle (tail) ==="
            tail -c 150000 /tmp/build.log 2>/dev/null || echo "(no build log — step never ran)"
            echo
            echo "=== publish step (tail) ==="
            tail -c 20000 /tmp/publish.log 2>/dev/null || echo "(no publish log — step never ran)"
          } > ci-logs/last-failure.log
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f ci-logs/last-failure.log
          git commit -m "CI: build failure log for ${{ github.sha }}" || exit 0
          for attempt in 1 2 3; do
            git push && exit 0
            git fetch origin "${{ github.ref_name }}" || true
            git rebase "origin/${{ github.ref_name }}" || { git rebase --abort || true; }
            sleep $((attempt * 3))
          done

  build-desktop-jar:
    name: Build Desktop JAR (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Kotlin compiler
        run: |
          curl -sL -o /tmp/kotlinc.zip \
            "https://github.com/JetBrains/kotlin/releases/download/v1.9.20/kotlin-compiler-1.9.20.zip"
          unzip -q /tmp/kotlinc.zip -d /tmp

      - name: Build desktop JAR
        run: |
          chmod +x fmradio-desktop/build.sh
          KOTLINC=/tmp/kotlinc/bin/kotlinc bash fmradio-desktop/build.sh

      - name: Bundle Windows package (JAR + launcher + librtlsdr DLLs)
        run: |
          set -e
          mkdir -p pkg
          cp fmradio-desktop/build/fmradio-desktop.jar pkg/
          [ -f FmRadio.exe ] && cp FmRadio.exe pkg/ || true

          # librtlsdr.dll is NOT installed by Zadig — Zadig only binds the WinUSB
          # driver to the dongle. The app additionally needs the userspace library
          # (and its libusb dependency) to talk to it, so ship them alongside.
          curl -sL -o rtlsdr.zip \
            "https://github.com/rtlsdrblog/rtl-sdr-blog/releases/latest/download/Release.zip"
          mkdir -p rtl && unzip -q -o rtlsdr.zip -d rtl
          # Prefer the x64 build; fall back to whatever rtlsdr.dll is present
          X64DIR=$(find rtl -type d -name 'x64' | head -1)
          if [ -n "$X64DIR" ]; then
            cp "$X64DIR"/*.dll pkg/ 2>/dev/null || true
          else
            find rtl -name '*.dll' -exec cp {} pkg/ \; 2>/dev/null || true
          fi
          # JNA resolves "rtlsdr"; some releases name it librtlsdr.dll
          [ -f pkg/rtlsdr.dll ] && cp pkg/rtlsdr.dll pkg/librtlsdr.dll || true
          echo "--- bundle contents ---"; ls -la pkg

          cat > pkg/ЧИТАТЬ.txt << 'TXT'
          FM Radio RTL-SDR — версия для Windows
          =====================================

          Запуск: двойной клик по FmRadio.exe
          (либо в консоли:  java -jar fmradio-desktop.jar)

          Нужна Java 11 или новее: https://adoptium.net

          ВАЖНО про драйвер
          -----------------
          В этой папке уже лежат rtlsdr.dll и libusb-1.0.dll — это библиотеки,
          через которые программа общается со свистком. Их НЕ НАДО никуда
          копировать, просто не разделяйте файлы из этой папки.

          Отдельно нужен драйвер WinUSB на самом свистке — он ставится
          программой Zadig (https://zadig.akeo.ie):
            1. Воткните свисток
            2. Запустите Zadig, меню Options → List All Devices
            3. Выберите "Bulk-In, Interface (Interface 0)" или "RTL2832U"
            4. Справа выберите WinUSB и нажмите Replace/Install Driver

          Если свисток составной (в списке два интерфейса) — ставьте
          именно на Interface 0.

          Если что-то не работает, программа теперь пишет в окне ошибки,
          чего именно не хватает: библиотеки или драйвера.
          TXT

          # The repo used to carry a stale FmRadio-Windows.zip; `zip -r` APPENDS
          # to an existing archive, which silently merged the old bundled-JRE
          # tree into the new package (40 MB with two copies of everything).
          rm -f ../FmRadio-Windows.zip FmRadio-Windows.zip
          cd pkg && zip -qr ../FmRadio-Windows.zip . && cd ..
          ls -la FmRadio-Windows.zip

      - name: Upload Desktop JAR
        uses: actions/upload-artifact@v4
        with:
          name: FmRadio-Desktop
          path: fmradio-desktop/build/fmradio-desktop.jar

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: FmRadio-Windows-Package
          path: FmRadio-Windows.zip

  create-release:
    name: Create Release
    needs: [build-android-apk, build-desktop-jar]
    if: always() && needs.build-android-apk.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version.json
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          cat > fmradio/version.json << EOF
          {
            "versionCode": $COMMIT_COUNT,
            "versionName": "3.0.$COMMIT_COUNT",
            "downloadUrl": "https://github.com/donmax76/IpTv/releases/download/fmradio-latest/FmRadio-release.apk"
          }
          EOF
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add fmradio/version.json
          if git diff --cached --quiet; then
            echo "version.json already current"
            exit 0
          fi
          git commit -m "Auto-update version.json to 3.0.$COMMIT_COUNT"
          # This push used to end in "|| true", which hid the one failure that
          # actually happens: the branch moving while the build ran. Three
          # commits pushed in quick succession each produced a build whose
          # version.json push was rejected as non-fast-forward and silently
          # dropped, so the file kept advertising an old version and the app
          # reported "no update available" for three releases running.
          #
          # The file's contents are NOT regenerated after a rebase. Its number
          # has to keep describing the commit whose APK was built and uploaded,
          # or the app downloads a build older than the version it was promised
          # and offers the same update for ever.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "version.json published on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing onto ${{ github.ref_name }} and retrying"
            git fetch origin "${{ github.ref_name }}" || true
            git rebase "origin/${{ github.ref_name }}" || { git rebase --abort || true; }
            sleep $((attempt * 3))
          done
          echo "::error::could not publish version.json — the app will not see this build"
          exit 1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          echo "=== All artifacts ==="
          find artifacts -type f 2>/dev/null || echo "No artifacts found"

      - name: Prepare release files
        run: |
          mkdir release
          # Desktop JAR (Kotlin app) + Windows launcher for it
          if [ -f artifacts/FmRadio-Desktop/fmradio-desktop.jar ]; then
            cp artifacts/FmRadio-Desktop/fmradio-desktop.jar release/
          fi
          if [ -f FmRadio.exe ]; then
            cp FmRadio.exe release/FmRadio.exe
          fi
          if [ -f artifacts/FmRadio-Windows-Package/FmRadio-Windows.zip ]; then
            cp artifacts/FmRadio-Windows-Package/FmRadio-Windows.zip release/
          fi
          # APKs - copy if exist
          if [ -f artifacts/FmRadio-debug.apk/fmradio-debug.apk ]; then
            cp artifacts/FmRadio-debug.apk/fmradio-debug.apk release/FmRadio.apk
          fi
          # Release APK — signed with debug key, so filename is fmradio-release.apk (not unsigned)
          if [ -f artifacts/FmRadio-release.apk/fmradio-release.apk ]; then
            cp artifacts/FmRadio-release.apk/fmradio-release.apk release/FmRadio-release.apk
          elif [ -f artifacts/FmRadio-release.apk/fmradio-release-unsigned.apk ]; then
            cp artifacts/FmRadio-release.apk/fmradio-release-unsigned.apk release/FmRadio-release.apk
          fi
          if [ -f artifacts/TVViewer-debug.apk/app-debug.apk ]; then
            cp artifacts/TVViewer-debug.apk/app-debug.apk release/TVViewer.apk
          fi

      - name: Delete old release
        run: |
          gh release delete fmradio-latest --yes 2>/dev/null || true
          git push origin :refs/tags/fmradio-latest 2>/dev/null || true
          git tag -d fmradio-latest 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        run: |
          # Build version info from git
          VERSION_HASH=$(git rev-parse --short=7 HEAD)
          VERSION_DATE=$(date -u +%Y-%m-%d\ %H:%M\ UTC)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
          RECENT_COMMITS=$(git log --oneline -10 --no-decorate)

          FILES=""
          if [ -f release/FmRadio.apk ]; then
            FILES="$FILES release/FmRadio.apk"
          fi
          if [ -f release/FmRadio-Windows.zip ]; then
            FILES="$FILES release/FmRadio-Windows.zip"
          fi
          if [ -f release/fmradio-desktop.jar ]; then
            FILES="$FILES release/fmradio-desktop.jar"
          fi
          if [ -f release/FmRadio.exe ]; then
            FILES="$FILES release/FmRadio.exe"
          fi
          if [ -f release/FmRadio-release.apk ]; then
            FILES="$FILES release/FmRadio-release.apk"
          fi
          if [ -f release/TVViewer.apk ]; then
            FILES="$FILES release/TVViewer.apk"
          fi

          NOTES=$(cat <<NOTES_EOF
          ## FM Radio — сборка #${COMMIT_COUNT} (${VERSION_HASH})
          **Дата:** ${VERSION_DATE}
          **Ветка:** \`${BRANCH_NAME}\`
          **Коммит:** \`${VERSION_HASH}\`

          ### Скачать:
          - **FmRadio.apk** — Android debug (RTL-SDR через USB OTG)
          - **FmRadio-release.apk** — Android release
          - **FmRadio-Windows.zip** — Windows: распаковать и запустить FmRadio.exe.
            Внутри уже есть librtlsdr.dll + libusb (Zadig всё равно нужен для драйвера свистка).
          - **fmradio-desktop.jar** — Linux/Mac (java -jar; librtlsdr ставится пакетом системы)
          - **TVViewer.apk** — TV Viewer

          ### Последние изменения:
          \`\`\`
          ${RECENT_COMMITS}
          \`\`\`
          NOTES_EOF
          )

          gh release create fmradio-latest \
            --title "FM Radio — сборка #${COMMIT_COUNT} (${VERSION_HASH})" \
            --notes "$NOTES" \
            $FILES
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
