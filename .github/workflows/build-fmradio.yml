name: Build FM Radio

on:
  push:
    branches: [ 'claude/fm-radio-app-*', 'main', 'master' ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build FM Radio APK
        run: |
          chmod +x gradlew
          ./gradlew :fmradio:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FmRadio-Android
          path: fmradio/build/outputs/apk/debug/fmradio-debug.apk

  build-desktop-jar:
    name: Build Desktop JAR (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Kotlin compiler
        run: |
          curl -sL -o /tmp/kotlinc.zip \
            "https://github.com/JetBrains/kotlin/releases/download/v1.9.20/kotlin-compiler-1.9.20.zip"
          unzip -q /tmp/kotlinc.zip -d /tmp

      - name: Build desktop JAR
        run: |
          chmod +x fmradio-desktop/build.sh
          KOTLINC=/tmp/kotlinc/bin/kotlinc bash fmradio-desktop/build.sh

      - name: Upload Desktop JAR
        uses: actions/upload-artifact@v4
        with:
          name: FmRadio-Desktop
          path: fmradio-desktop/build/fmradio-desktop.jar

  create-release:
    name: Create Release
    needs: [build-android-apk, build-desktop-jar]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir release
          cp artifacts/FmRadio-Android/fmradio-debug.apk release/FmRadio-Android.apk
          cp artifacts/FmRadio-Desktop/fmradio-desktop.jar release/fmradio-desktop.jar
          # Windows launcher for the JAR (pre-built, committed in repo)
          if [ -f FmRadio.exe ]; then
            cp FmRadio.exe release/FmRadio.exe
          fi

      - name: Delete old release
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        run: |
          FILES="release/FmRadio-Android.apk release/fmradio-desktop.jar"
          if [ -f release/FmRadio.exe ]; then
            FILES="$FILES release/FmRadio.exe"
          fi
          gh release create latest \
            --title "FM Radio - Latest Build" \
            --notes "Автоматическая сборка FM Radio из актуальных исходников.

          **Android:**
          - **FmRadio-Android.apk** — установить на телефон/планшет (это СВЕЖАЯ сборка со всеми исправлениями)

          **Windows/Linux/Mac (нужна Java 11+):**
          - **fmradio-desktop.jar** — запускать: \`java -jar fmradio-desktop.jar\`
          - **FmRadio.exe** — лаунчер для Windows (положить рядом с fmradio-desktop.jar и запустить)

          Версия и дата сборки видны в заголовке окна приложения." \
            --latest \
            $FILES
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
